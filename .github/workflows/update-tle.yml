name: Update Sentinel TLEs

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC (06:17 Istanbul)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-tle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch TLEs from CelesTrak
        run: python .github/scripts/update_tle.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- sentinel-overhead/tle.json)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel-overhead/tle.json
          git commit -m "Update Sentinel TLEs ($(date -u +%Y-%m-%d))"
          git push
